[project]
name = "enterprise-document-intelligence"
version = "0.1.0"
description = "AI-powered resume evaluation using Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "cryptography<49",
    "fastapi[standard]>=0.162.0",
    "groq>=1.7.0",
    "numpy==1.26.4",
    "onnxruntime==1.19.2",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.2",
    "pypdfium2==5.11.0",
    "python-docx>=1.2.0",
    "sentence-transformers==3.4.1",
    "torch==2.2.2",
    "transformers<5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true