<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Evaluation Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #1e293b; line-height: 1.5; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
        label { font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; background: white; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 18px; width: 100%; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { margin-top: 14px; font-weight: 600; color: #2563eb; }
        pre { background: #0f172a; color: #f8fafc; padding: 18px; border-radius: 8px; overflow-x: auto; font-size: 13px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Multi-Resume Batch Evaluation Test</h1>
    <div class="card">
        <form id="batchForm">
            <label for="role_title">Role Title:</label>
            <input type="text" id="role_title" name="role_title" value="Junior Frontend Developer" required>

            <label for="required_skills">Required Skills (comma-separated):</label>
            <input type="text" id="required_skills" name="required_skills" value="HTML, CSS, JavaScript, React" required>

            <label for="files">Select Resumes (Select 2+ files):</label>
            <input type="file" id="files" name="files" multiple accept=".pdf,.docx" required>

            <button type="submit" id="submitBtn">Evaluate Candidate Batch</button>
        </form>
        <div id="status"></div>
    </div>

    <h2>API Output (Ranked Leaderboard)</h2>
    <pre id="output">Select resumes above and click evaluate to view the sorted candidate ranking JSON.</pre>

    <script>
        document.getElementById('batchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('status');
            const outputPre = document.getElementById('output');
            const submitBtn = document.getElementById('submitBtn');

            const formData = new FormData(e.target);

            statusDiv.textContent = 'Processing resumes through RAG engine... Please wait.';
            statusDiv.style.color = '#2563eb';
            submitBtn.disabled = true;
            outputPre.textContent = 'Executing vector search & Groq extraction across files...';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/evaluate-batch', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || `Server error: ${response.status}`);
                }

                const result = await response.json();
                statusDiv.textContent = `Success! Processed and ranked ${result.total_candidates} candidates.`;
                statusDiv.style.color = '#16a34a';
                outputPre.textContent = JSON.stringify(result, null, 2);
            } catch (err) {
                statusDiv.textContent = `Error: ${err.message}`;
                statusDiv.style.color = '#dc2626';
                outputPre.textContent = `Failed to process batch request: ${err.message}`;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
